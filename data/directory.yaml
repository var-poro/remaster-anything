  game_versions: [GOTY 1.112fm]
  requires: []
  conflicts_with: []
  open_source: partial
  redistribution: allowed
  last_activity: 2012-11
  qa: community-reports
  notes: >-
    By Dave Watts and others. Replaces about 80% of 2000+ environment textures with
    hand-made, upscaled versions "with a distinct grungy visual look": a deliberate change
    of style. Needs an S3TC-capable renderer (OpenGL, Direct3D 9 or 10) with S3TC=True.
    The author allows reuse in Deus Ex mods with credit. An SDK for compiling
    high-resolution textures is published. Included in GMDX and Revision.
  sources:
    - https://www.moddb.com/mods/new-vision
  checked: 2026-10-31

