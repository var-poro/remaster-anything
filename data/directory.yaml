- game: Deus Ex
  slug: deus-ex
  year: 2000
  engine: Unreal Engine 1
  project: Direct3D 10 renderer (Kentie)
  url: https://kentie.net/article/d3d10drv/
  kind: renderer
  status: playable
  axes: { display: partial, textures: partial, rendering: yes, audio: no, port: no }
  fidelity: mixed
  game_versions: [GOTY 1.112fm (Steam)]
  requires: []
  conflicts_with: []
  open_source: partial
  redistribution: unknown
  last_activity: unknown
  qa: community-reports
  notes: >-
    v29 (release date not given). Anti-aliasing, anisotropic filtering, frame limit (default
    100), automatic FOV, HDR and bloom, optional bump and parallax mapping. ClassicLighting
    (default true) matches the original renderers' look; HDR, bloom and parallax change it.
    Its texture hotloading is the override path New Vision 2.0a relies on. Known issues:
    black screen on Alt+Tab in fullscreen (enable Precache), stutter with NVIDIA drivers 442+
    (disable its limiter, cap at 120 FPS in the driver), Print Screen does not work.
    Source is published, no license stated.
  sources:
    - https://kentie.net/article/d3d10drv/
    - https://www.pcgamingwiki.com/wiki/Deus_Ex
  checked: 2026-10-31

