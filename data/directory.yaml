- game: Deus Ex
  slug: deus-ex
  year: 2000
  engine: Unreal Engine 1
  project: Deus Exe (Kentie's launcher)
  url: https://kentie.net/article/dxguide/
  kind: launcher
  status: playable
  axes: { display: yes, textures: no, rendering: no, audio: partial, port: no }
  fidelity: faithful
  game_versions: [GOTY 1.112fm (Steam, GOG)]
  requires: []
  conflicts_with: []
  open_source: partial
  redistribution: unknown
  last_activity: unknown
  qa: community-reports
  notes: >-
    Replacement DeusEx.exe, v8.1 (release date not given; the page was last edited 2016-02).
    Sets FOV, borderless window, GUI scaling, frame limit, raw input; fixes the 2 TB
    "low disk space" save bug and audio stutter (PCGamingWiki). Needs the VC++ 2015 x86
    runtime and Windows Vista or later (5.3 for XP). Moves settings and saves to
    %USERPROFILE%\Documents\Deus Ex. Known issues: its frame limiter can freeze menus,
    AutoFOV crashes when the window is minimized, does not work with the Direct2Drive or
    Impulse releases. Source is published (needs the game headers), no license stated.
    The Community Update calls it "no longer developed or supported" and defaults to Launch.
  sources:
    - https://kentie.net/article/dxguide/
    - https://www.pcgamingwiki.com/wiki/Deus_Ex
    - https://github.com/Defaultplayer001/Deus-Ex-Universe-Community-Update-/tree/master/%5B1.0%5D%20Deus%20Ex%20-%20Windows-Linux-macOS-Android
  checked: 2026-10-31

