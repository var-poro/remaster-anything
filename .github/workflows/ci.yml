name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The owner's machines (Windows, macOS) on current LTS, plus the oldest supported Node.
        include:
          - { os: windows-latest, node: 24 }
          - { os: macos-latest, node: 24 }
          - { os: ubuntu-latest, node: 24 }
          - { os: ubuntu-latest, node: "22.18" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
